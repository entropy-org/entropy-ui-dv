name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  release:
    if: github.repository_owner == 'entropy-org'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@^11.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @entropy-ui/data-views exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm publish:next
        env:
          NPM_CONFIG_PROVENANCE: true
